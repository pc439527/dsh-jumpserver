name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: typecheck + tests + build + smoke (${{ matrix.os }}, node ${{ matrix.node }})
    # The plugin ships inside the Desktop app, so Windows is a first-class gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        # DSH release-candidate packages carry mutually-conflicting peer ranges;
        # --legacy-peer-deps mirrors how the project is installed (package-lock
        # is generated with npm install --package-lock-only --legacy-peer-deps).
        run: npm ci --legacy-peer-deps
      - name: Typecheck (host + client)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (host + version meta + client bundle)
        run: npm run build
      - name: Classifier corpus gate + snapshot report (built artifact)
        run: node scripts/classifier-report.mjs classifier-report.json
      - name: Minimal browser interaction regressions
        run: npm run test:e2e
      - name: Client bundle smoke
        run: npm run smoke:client

  # lib/ ships in the repo so GitHub installs work without a local toolchain.
  # That only holds if lib/ never lags src/, so gate it: rebuild from scratch and
  # fail when the committed output is not what this commit's sources produce.
  # Ubuntu only — the check is a byte comparison, and cross-platform toolchain
  # differences would turn it into a coin flip.
  lib-fresh:
    name: committed lib/ matches a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Committed lib/ is not stale
        run: npm run check:lib
